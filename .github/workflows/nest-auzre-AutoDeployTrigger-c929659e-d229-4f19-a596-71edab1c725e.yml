name: Trigger auto deployment for nest-auzre

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/nest-auzre-AutoDeployTrigger-c929659e-d229-4f19-a596-71edab1c725e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NESTAUZRE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NESTAUZRE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NESTAUZRE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: nestreg.azurecr.io
          registryUsername: ${{ secrets.NESTAUZRE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NESTAUZRE_REGISTRY_PASSWORD }}
          containerAppName: nest-auzre
          resourceGroup: nest-azure
          imageToBuild: nestreg.azurecr.io/nest-auzre:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


